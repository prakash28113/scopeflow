<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bric;src:url(../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2);font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:Inter;src:url(../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2);font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px}
body{font-family:Inter;color:#101828;position:relative;overflow:hidden;background:#fff}
.wash{position:absolute;inset:0;background:
 radial-gradient(40% 55% at 8% 95%,#d6f5e3 0%,transparent 70%),
 radial-gradient(38% 50% at 98% 10%,#fff1c2 0%,transparent 70%),
 radial-gradient(50% 55% at 80% 105%,#d9e5ff 0%,transparent 72%)}
.wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column}
.brand img{height:58px;display:block}
h1{font-family:Bric;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-.035em;max-width:720px;margin-top:52px}
p{font-size:27px;line-height:1.4;color:#475467;max-width:600px;margin-top:26px}
.foot{margin-top:auto;font-size:24px;font-weight:600;color:#005DD4}
.card{position:absolute;right:64px;top:150px;width:340px;background:#fff;border-radius:22px;padding:26px 28px;box-shadow:0 24px 60px -18px rgb(16 24 40/.25),0 0 0 1px #eaecf0}
.k{font-size:15px;font-weight:600;color:#667085;text-transform:uppercase;letter-spacing:.08em}
.t{font-family:Bric;font-weight:700;font-size:32px;margin-top:6px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:19px}
.tag{font-size:15px;font-weight:650;padding:5px 11px;border-radius:999px}
.ok{background:#dcfae6;color:#067647}.amb{background:#fef0c7;color:#93370d}.blue{background:#e3ebff;color:#2f56a8}
.bar{height:10px;border-radius:99px;background:#eaecf0;margin-top:22px;overflow:hidden}.bar i{display:block;height:100%;width:62%;background:#12b76a;border-radius:99px}
.small{font-size:15px;color:#667085;margin-top:8px}
</style></head><body><div class="wash"></div><div class="wrap">
<div class="brand"><img src="../../brand/scopeflow-logo.svg" alt="ScopeFlow"></div>
<h1>“Just one small change” now comes with a price.</h1>
<p>Approved scope, revisions, change orders and payments for freelancers.</p>
<div class="foot">scopeflow.in</div>
</div>
<div class="card">
<div class="k">Project</div><div class="t">Brand kit</div>
<div class="row"><span>Scope</span><span class="tag ok">Approved</span></div>
<div class="row"><span>Revisions</span><span class="tag blue">2 of 3 used</span></div>
<div class="row"><span>Extra page</span><span class="tag amb">+ ₹6,000</span></div>
<div class="bar"><i></i></div><div class="small">₹28,000 of ₹45,000 paid</div>
</div>
</body></html>
