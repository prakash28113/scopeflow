# Weekly encrypted database backup — free GitHub Actions minutes, no new services.
#
# Every Sunday night (and on demand: Actions → Backup → Run workflow):
#   1. reads every table through Supabase's database query endpoint (the existing release token),
#   2. compresses and encrypts it with AES-256-GCM, key derived from BACKUP_PASSPHRASE (scrypt),
#   3. proves it restores: decrypts it and loads it into a fresh database built from the migrations,
#   4. keeps the encrypted file as a workflow artifact for 90 days.
# This repository is public: artifacts can be downloaded by signed-in GitHub users, which is why the file
# is encrypted before it is uploaded and the log shows no data. Only the passphrase holder can open it.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  already set for releases (Database access to this project)
#   BACKUP_PASSPHRASE      added by the owner: a long passphrase kept somewhere safe (see docs/BACKUPS.md)
name: Backup

on:
  schedule:
    - cron: "37 21 * * 0" # Sunday 21:37 UTC = Monday 03:07 in India
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted backup
    if: github.repository == 'prakash28113/scopeflow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Back up, encrypt and test the restore
        id: backup
        run: node scripts/backup/backup.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0 # already compressed and encrypted
