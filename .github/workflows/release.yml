# Verify, set up the database, deploy and smoke-test ScopeFlow — all on free tiers.
#
# Runs on every push to main, or manually (Actions → Release → Run workflow).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   Supabase → Account → Access Tokens
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers"
# Until they exist, the release job stops cleanly and explains what's missing.
# Owners who can't add secrets can instead run it with `handoff_issue` set: the
# run then receives the credentials once, encrypted to a key only that run holds
# (see scripts/ci/receive-credentials.sh). Nothing is stored afterwards.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      handoff_issue:
        description: "Issue number for a one-time encrypted credential hand-off (leave empty to use repository secrets)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (tests, secret scan, dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  release:
    name: Database, deploy and live checks
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      issues: write # only used by the optional one-time credential hand-off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Receive one-time credentials
        if: ${{ inputs.handoff_issue != '' }}
        run: bash scripts/ci/receive-credentials.sh
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.handoff_issue }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
      - name: Release
        run: |
          for name in SUPABASE_ACCESS_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            file="$RUNNER_TEMP/handoff/$name"
            if [ -z "${!name:-}" ] && [ -f "$file" ]; then export "$name=$(cat "$file")"; fi
          done
          node scripts/ci/release.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
          BETA_EMAILS: ${{ vars.BETA_EMAILS }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Remove hand-off files
        if: always()
        run: rm -rf "$RUNNER_TEMP/handoff"
