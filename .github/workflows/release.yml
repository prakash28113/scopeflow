# ScopeFlow CI and release — free GitHub Actions minutes, free Supabase and Cloudflare tiers.
#
# On every push and pull request: all automated checks (no deploy, no production access).
#   verify       unit + database tests, type check, secret scan, dependency audit,
#                the unit suite again in three time zones, permission audit report
#   concurrency  races real PostgreSQL connections against the portal functions
#   e2e          the 22-step browser walkthrough on Cloudflare's runtime (workerd)
#
# Deploying is manual only: Actions → Release → Run workflow (the owner's explicit approval).
#   action = release           apply pending database migrations, then publish the app
#   action = rollback-app      put the previous app version back live (Cloudflare keeps versions)
#   action = rollback-database undo the newest database migration (type ROLLBACK to confirm)
#
# Credentials live only in repository secrets (Settings → Secrets and variables → Actions),
# least privilege — see docs/release/v1.1/DEPLOYMENT_PLAN.md:
#   SUPABASE_ACCESS_TOKEN   scoped to this project: Database read/write (+ Auth config write)
#   CLOUDFLARE_API_TOKEN    custom token: Account → Workers Scripts → Edit, this account only
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account id
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [release, rollback-app, rollback-database]
        default: release
      confirm:
        description: "For rollback-database only: type ROLLBACK"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (tests, time zones, secret scan, dependency audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit + database tests, type check, secret scan, dependency audit
        run: npm run verify
      - name: Unit tests in three time zones (UTC−10, UTC+14, India)
        run: npm run test:tz
      - name: Test report and permission audit
        run: |
          mkdir -p reports
          npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
          node scripts/audit/permission-report.mjs > reports/permission-audit.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-reports
          path: reports/

  concurrency:
    name: Concurrency (real PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/concurrency
      - run: npm test
        working-directory: tests/concurrency

  e2e:
    name: Browser walkthrough (22 steps, Cloudflare runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: tests/e2e
      - name: Install Chromium for Playwright
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Download PostgREST 12.2.12 (open source, local stand-in for Supabase's API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v12.2.12 -R PostgREST/postgrest -p "postgrest-v12.2.12-linux-static-x*.tar.xz" -D "$RUNNER_TEMP/pgrst"
          tar -xJf "$RUNNER_TEMP"/pgrst/*.tar.xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/postgrest" --version
      - name: Run the walkthrough
        run: POSTGREST_BIN="$RUNNER_TEMP/postgrest" bash tests/e2e/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: |
            tests/e2e/shots/
            tests/e2e/.logs/

  release:
    name: Database, deploy and live checks
    needs: [verify, concurrency, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release
        run: node scripts/ci/release.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
          BETA_EMAILS: ${{ vars.BETA_EMAILS }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

  rollback:
    name: Rollback
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'rollback-') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rollback
        run: node scripts/ci/rollback.mjs
        env:
          ROLLBACK_TARGET: ${{ inputs.action }}
          ROLLBACK_CONFIRM: ${{ inputs.confirm }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
